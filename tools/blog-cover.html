<!doctype html><html><head><meta charset="utf-8">
<!--
  Blog cover template (not a page on the site).
  Edit the kicker, the big title, the two-line subtitle and the small line,
  then screenshot it twice with Playwright:
    og    1200x630  --pad:80px --big:210px --mid:58px --s1:22px --s2:30px
    thumb  940x788  --pad:70px --big:230px --mid:62px --s1:22px --s2:30px
  Save as JPEG (quality ~86) in img/blog/<slug>-og.jpg and <slug>-thumb.jpg.
  Kicker colour: red (#ff3b3b) for breaking news/leaks, yellow for explainers.
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--w:1200px;--h:630px;--pad:80px;--big:210px;--mid:58px;--s1:22px;--s2:30px}
*{box-sizing:border-box;margin:0}
body{width:var(--w);height:var(--h);font-family:Poppins,sans-serif;color:#ccc;overflow:hidden;
 background:#1d1d1d radial-gradient(circle,#2b2b2b 1.3px,transparent 1.8px) 0 0/14px 14px}
.wrap{position:relative;width:100%;height:100%;padding:var(--pad);display:flex;flex-direction:column;justify-content:center}
.glow{position:absolute;right:-12%;top:-30%;width:70%;height:120%;background:radial-gradient(closest-side,rgba(255,220,22,.18),transparent);pointer-events:none}
.live{display:inline-flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.18em;font-size:var(--s1);color:#ff3b3b;text-transform:uppercase}
.live i{width:18px;height:18px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 7px rgba(255,59,59,.2),0 0 22px rgba(255,59,59,.8)}
h1{font-size:var(--big);line-height:.92;font-weight:800;letter-spacing:-.04em;color:#ffdc16;text-shadow:0 0 40px rgba(255,220,22,.35);margin:18px 0 10px}
h2{font-size:var(--mid);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:#e6e6e6}
p{margin-top:18px;font-size:var(--s2);font-weight:500;color:#8a8a8a}
.tag{position:absolute;left:var(--pad);bottom:calc(var(--pad) * .55);font-size:var(--s1);font-weight:700;letter-spacing:.2em;color:#ffdc16}
.time{position:absolute;right:var(--pad);bottom:calc(var(--pad) * .5);display:flex;flex-direction:column;align-items:center;padding:12px 20px;border-radius:14px;background:#ffdc16;color:#000;line-height:1}
.time b{font-size:var(--s2);font-weight:800}.time small{font-size:calc(var(--s1) * .8);font-weight:700;letter-spacing:.14em;margin-top:6px}
</style></head><body><div class="wrap"><div class="glow"></div>
<span class="live" style="color:#ffdc16"><i style="background:#ffdc16;box-shadow:0 0 0 7px rgba(255,220,22,.2),0 0 22px rgba(255,220,22,.8)"></i>Online</span>
<h1>GTA 6</h1>
<h2>Online at launch?<br>The short answer.</h2>
<p>What Rockstar has actually said.</p>
<span class="tag">NEDCODE.COM</span>
<span class="time"><b>NOV 19</b><small>RELEASE</small></span>
</div></body></html>
